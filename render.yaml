services:
  - type: web
    name: prijsmonitor
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prijsmonitor-db
          property: connectionString
      - key: TZ
        value: Europe/Amsterdam
      - key: CHECK_HOUR
        value: "8"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: LOAD_INITIAL_PRODUCTS
        value: "true"
      - key: INITIAL_DEFAULT_EMAIL
        value: chris.j.bakker@gmail.com
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
databases:
  - name: prijsmonitor-db
    databaseName: prijsmonitor
    user: prijsmonitor
